[package]
name = "arch-flaechen-tool"
version = "0.11.1"
description = "Visuell gestützte Flächenberechnung für Gebäude (DIN 277, WoFlV)"
authors = ["Tobias Pendzialek"]
license = "MIT"
edition = "2021"

[lib]
name = "arch_flaechen_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
