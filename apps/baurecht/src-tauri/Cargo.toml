[package]
name = "baurecht"
version = "0.26.0"
description = "Rechtsprüfung vor dem Bauantrag: Vorschriften je Paragraf als Ampel"
authors = ["Tobias Pendzialek"]
license = "MIT"
edition = "2021"

[lib]
name = "baurecht_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Abruf der Gesetzestexte, Satzungen und Geodienste (netz.rs) – rustls, ohne Systembibliotheken
ureq = "2.12"
# Zertifikate wie das Betriebssystem (Firmen-CAs im Windows-Zertifikatspeicher, netz_verbindung.rs) – dieselbe rustls
# wie ureq, ohne OpenSSL bzw. native-tls; mitgelieferte Stammzertifikate zusätzlich
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
webpki-root-certs = "1"
# Signatur des Regelpakets (Ed25519) – ring kommt ohnehin mit rustls
ring = "0.17"

# Proxy aus den Internetoptionen von Windows (netz_verbindung.rs)
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
