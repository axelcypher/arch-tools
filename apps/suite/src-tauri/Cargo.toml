[package]
name = "arch-tools"
version = "0.26.1"
description = "Rahmen-App: alle arch-tools in einem Fenster"
authors = ["Tobias Pendzialek"]
license = "MIT"
edition = "2021"

[lib]
name = "arch_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Projektkarte (sj_prokarte.sdb) – SQLite mitkompiliert, damit nichts installiert sein muss
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
