name: Build & Release

# Baut je App die Windows-Installer und veröffentlicht ein GitHub-Release, sobald sich die Version
# der App (apps/<app>/package.json) auf main ändert. Manuell startbar – dann wird die gewählte App
# in ihrer aktuellen Version (neu) gebaut.
#
#   QUADRIO   apps/flaechenrechner   Tag v<version>             (Flächenrechner)
#   TERRIO    apps/grz               Tag grz-v<version>         (GRZ-Nachweis)
#   NUMIO     apps/kosten            Tag kosten-v<version>      (Kostenermittlung)
#   ATLAS     apps/ordner            Tag ordner-v<version>      (Projektordner)
#   RECTIO    apps/entzerrung        Tag entzerrung-v<version>  (Entzerrung)
#   PERMIO    apps/formulare         Tag formulare-v<version>   (Formulare)
#   FABRIO    apps/ava               Tag ava-v<version>         (Ausschreibung, Vergabe, Abrechnung, Bauleitung)
#   Arkly     apps/suite             Tag suite-v<version>       (Rahmen-App: alle Apps in einem Fenster)
#
# Arkly enthält alle Apps. Ihre Version hebt der Lauf selbst: Hat eine andere App eine neue Version und ist die
# Arkly-Version schon veröffentlicht, setzt „Arkly-Version setzen“ die nächste freie Nummer (scripts/suite-version.mjs),
# committet sie mit GITHUB_TOKEN nach main (das startet keine weiteren Läufe) und baut Arkly aus diesem Commit mit.
#
# Automatische Updates: Die Installer werden signiert (Secrets TAURI_SIGNING_PRIVATE_KEY und
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD). Das Update-Manifest jeder App liegt als <app>.json im Release
# „updater“ – diese feste Adresse fragen die installierten Apps ab (tauri.conf.json → plugins.updater).
on:
  push:
    branches: [main]
    paths:
      - apps/*/package.json
      - apps/*/src-tauri/tauri.conf.json
      - apps/*/src-tauri/Cargo.toml
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [alle, flaechenrechner, grz, kosten, ordner, entzerrung, formulare, ava, suite]
        default: alle

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Versionen prüfen
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
      any: ${{ steps.v.outputs.any }}
      # der gebaute Stand: mit automatisch gesetzter Arkly-Version der neue Commit, sonst der auslösende
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # volle Historie, damit der Versions-Commit auf ein inzwischen weitergeführtes main aufsetzen kann
          fetch-depth: 0
      - name: Arkly-Version setzen
        if: github.event_name == 'push'
        run: |
          # ein Fehler hier darf die Releases der anderen Apps nie blockieren: dann nur Warnung, Arkly diesmal nicht
          if ! out=$(node scripts/suite-version.mjs automatisch); then
            echo "::warning::Arkly-Version nicht automatisch gesetzt (Fehler im Skript, siehe oben) – Arkly wird diesmal nicht gebaut."
            git reset -q --hard "$GITHUB_SHA"
            exit 0
          fi
          echo "$out"
          neu=$(printf '%s\n' "$out" | sed -n 's/^neu=//p')
          [ -n "$neu" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -a -m "Arkly $neu: neue Fassungen der Apps (automatisch im Release-Lauf)"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "Arkly $neu nach main geschrieben ($(git rev-parse --short HEAD))."
              exit 0
            fi
            # main inzwischen weiter: darauf aufsetzen und erneut versuchen
            if ! git pull -q --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              break
            fi
          done
          echo "::warning::Arkly $neu ließ sich nicht nach main schreiben (Schutzregel, Netz oder Konflikt – etwa weil ein PR Arkly inzwischen selbst gehoben hat; dann baut dessen Lauf Arkly). Arkly wird diesmal nicht gebaut. Bitte die Arkly-Version auf main prüfen und ggf. über der aktuellen setzen: node scripts/suite-version.mjs setzen x.y.z"
          git reset -q --hard "$GITHUB_SHA"
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          WAHL: ${{ inputs.app }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          apps='[]'
          # dieselbe Liste und dieselben Tag-Schemata in scripts/versionen-pruefen.mjs (Versionsprüfung im PR)
          for d in flaechenrechner grz kosten ordner entzerrung formulare ava suite; do
            # der öffentliche Schlüssel in der App muss zum Signierschlüssel passen, sonst lehnen die Apps jedes Update ab
            k=$(node -p "require('./apps/$d/src-tauri/tauri.conf.json').plugins.updater.pubkey")
            if [ -n "$PUBKEY" ] && [ "$k" != "$(printf '%s' "$PUBKEY" | tr -d '[:space:]')" ]; then
              echo "::error::$d: plugins.updater.pubkey in tauri.conf.json weicht vom Secret TAURI_UPDATER_PUBKEY ab"
              exit 1
            fi
            v=$(node -p "require('./apps/$d/package.json').version")
            t=$(node -p "require('./apps/$d/src-tauri/tauri.conf.json').version")
            c=$(grep -m1 '^version' "apps/$d/src-tauri/Cargo.toml" | cut -d'"' -f2)
            if [ "$v" != "$t" ] || [ "$v" != "$c" ]; then
              echo "::error::$d: Versionen uneinheitlich: package.json $v, tauri.conf.json $t, Cargo.toml $c"
              exit 1
            fi
            case "$d" in
              # Release-Name = Produktname (packages/core/src/appNamen.ts); Tags bleiben bei der Kennung
              flaechenrechner) tag="v$v"; name="QUADRIO"; web="quadrio-web.zip" ;;
              grz) tag="$d-v$v"; name="TERRIO"; web="terrio-web.zip" ;;
              kosten) tag="$d-v$v"; name="NUMIO"; web="numio-web.zip" ;;
              ordner) tag="$d-v$v"; name="ATLAS"; web="atlas-web.zip" ;;
              entzerrung) tag="$d-v$v"; name="RECTIO"; web="rectio-web.zip" ;;
              formulare) tag="$d-v$v"; name="PERMIO"; web="permio-web.zip" ;;
              ava) tag="$d-v$v"; name="FABRIO"; web="fabrio-web.zip" ;;
              suite) tag="$d-v$v"; name="Arkly"; web="arkly-web.zip" ;;
            esac
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$WAHL" != "alle" ] && [ "$WAHL" != "$d" ]; then continue; fi
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$d: Tag $tag existiert bereits – kein neues Release."
              continue
            fi
            apps=$(echo "$apps" | jq -c --arg d "$d" --arg v "$v" --arg tag "$tag" --arg name "$name" --arg web "$web" '. + [{app: $d, version: $v, tag: $tag, name: $name, web: $web}]')
          done
          echo "matrix={\"include\":$apps}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$apps" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Releases: $apps"
      - name: Release für die Update-Manifeste anlegen
        if: steps.v.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view updater >/dev/null 2>&1 || gh release create updater --latest=false --target "$GITHUB_SHA" \
            --title "Update-Manifeste" \
            --notes "Technisches Release: enthält je App das Manifest für die automatischen Updates (<app>.json). Die Installer stehen in den Releases der einzelnen Apps."

  windows:
    name: ${{ matrix.name }} (Windows) + Release
    needs: version
    if: needs.version.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/${{ matrix.app }}
          tauriScript: npx tauri
          tagName: ${{ matrix.tag }}
          # Tag am gebauten Stand (mit automatisch gesetzter Arkly-Version), nicht am auslösenden Commit
          releaseCommitish: ${{ needs.version.outputs.sha }}
          releaseName: ${{ matrix.name }} v${{ matrix.version }}
          releaseBody: Windows-Installer (.exe / .msi) und Web-Version (${{ matrix.web }}).
          releaseDraft: false
          prerelease: false
          # latest.json mit Signaturen; installierte Apps aktualisieren sich über den NSIS-Installer
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Web-Version anhängen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "apps/${{ matrix.app }}/dist" && 7z a -tzip "$GITHUB_WORKSPACE/${{ matrix.web }}" . >/dev/null && cd "$GITHUB_WORKSPACE"
          gh release upload "${{ matrix.tag }}" "${{ matrix.web }}" --clobber
      - name: Update-Manifest veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ matrix.tag }}" --pattern latest.json --output "${{ matrix.app }}.json" --clobber
          # nur ein vollständiges Manifest der gebauten Version veröffentlichen
          node -e "
            const m = JSON.parse(require('fs').readFileSync('${{ matrix.app }}.json', 'utf8'));
            const p = Object.entries(m.platforms || {});
            if (m.version !== '${{ matrix.version }}') throw new Error('Manifest-Version ' + m.version + ' statt ${{ matrix.version }}');
            if (!p.length || p.some(([, x]) => !x.signature || !x.url)) throw new Error('Manifest ohne Signatur oder Adresse');
            for (const [k, x] of p) console.log(m.version, k, x.url);
          "
          gh release upload updater "${{ matrix.app }}.json" --clobber
