name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Tests & Web-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            apps/flaechenrechner/dist
            apps/grz/dist
            apps/kosten/dist
            apps/ordner/dist
            apps/entzerrung/dist

  tauri:
    name: Tauri-Hülle prüfen (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: flaechenrechner
            pkg: flaechenrechner
          - app: grz
            pkg: grz-nachweis
          - app: kosten
            pkg: kostenermittlung
          - app: ordner
            pkg: projektordner
          - app: entzerrung
            pkg: entzerrung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Systempakete für Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      - run: npm ci
      # generate_context! bettet das Web-Frontend ein – dist muss existieren
      - run: npm run build -w ${{ matrix.pkg }}
      - run: cargo check --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml
