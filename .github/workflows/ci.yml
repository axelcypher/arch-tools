name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Tests & Web-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Installer-Hooks (Umbenennung) mit makensis kompilieren – sonst fiele ein Fehler erst im Release auf
      - name: Installer-Hooks (NSIS) prüfen
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q nsis >/dev/null
          bash scripts/nsis-hooks-pruefen.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            apps/flaechenrechner/dist
            apps/grz/dist
            apps/kosten/dist
            apps/ordner/dist
            apps/entzerrung/dist
            apps/formulare/dist
            apps/ava/dist
            apps/baurecht/dist
            apps/suite/dist

  tauri:
    name: Tauri-Hülle prüfen (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: flaechenrechner
            pkg: flaechenrechner
          - app: grz
            pkg: grz-nachweis
          - app: kosten
            pkg: kostenermittlung
          - app: ordner
            pkg: projektordner
          - app: entzerrung
            pkg: entzerrung
          - app: formulare
            pkg: formulare
          - app: ava
            pkg: ava
          - app: baurecht
            pkg: baurecht
            # Tests der Tauri-Hülle (Host-Liste, Umleitungen, Signatur, Ablage) – die Rahmen-App bindet dieselbe Datei ein
            test: true
          # die Rahmen-App bettet die Web-Builds aller Apps ein
          - app: suite
            pkg: arch-tools-suite
            build: build:alle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Systempakete für Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      - run: npm ci
      # generate_context! bettet das Web-Frontend ein – dist muss existieren
      - run: npm run ${{ matrix.build || 'build' }} -w ${{ matrix.pkg }}
      - run: cargo check --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml
      - if: matrix.test
        run: cargo test --lib --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml
